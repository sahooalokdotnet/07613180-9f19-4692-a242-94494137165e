name: .NET CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      # Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Install .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore dependencies
      - name: Restore
        run: dotnet restore MySolution.slnx

      # Build the solution
      - name: Build
        run: dotnet build MySolution.slnx --no-restore --configuration Release

      # Run unit tests
      - name: Test
        run: dotnet test MySolution.slnx --no-build --configuration Release --verbosity normal